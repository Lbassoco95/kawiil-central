name: Deploy microsoft-api now
on:
  push:
    branches: [cursor/microsoft-api-edge-deploy-fa42]
    paths: [supabase/functions/microsoft-api/**, .github/workflows/deploy-microsoft-api-now.yml]
  workflow_dispatch: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase functions deploy microsoft-api --project-ref "$PROJECT_REF" --no-verify-jwt
