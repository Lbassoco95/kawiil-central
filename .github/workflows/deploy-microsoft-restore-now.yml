name: Deploy Microsoft Edge restore now
on:
  push:
    branches: [cursor/fix-microsoft-api-worker-error-2969]
    paths:
      - "supabase/functions/microsoft-api/**"
      - "supabase/functions/outlook-account-api/**"
      - "supabase/functions/_shared/microsoftOAuthErrors.ts"
      - ".github/workflows/deploy-microsoft-restore-now.yml"
  workflow_dispatch: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy microsoft-api and outlook-account-api
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${PROJECT_REF:-}"
          supabase functions deploy microsoft-api --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy outlook-account-api --project-ref "$PROJECT_REF" --no-verify-jwt
