body{margin:0}
.zk{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;color:#323a48;font-size:14px;line-height:20px;background:#f3f4f6;position:relative;overflow:hidden;-webkit-font-smoothing:antialiased}
.zk *{box-sizing:border-box}
.zk-bg{position:absolute;left:0;top:0;right:0;bottom:0;background:radial-gradient(60% 50% at 12% 0%,rgba(250,231,190,.55),transparent 70%),radial-gradient(55% 45% at 95% 15%,rgba(197,236,223,.45),transparent 70%),radial-gradient(50% 40% at 50% 100%,rgba(208,230,246,.4),transparent 70%);pointer-events:none}

.zk a,.zk button,.zk textarea,.zk input{font-family:inherit;color:inherit;text-decoration:none}
.zk a:focus-visible,.zk button:focus-visible,.zk textarea:focus-visible{outline:2px solid #0075f0;outline-offset:2px}
.mut{color:#6b7280}
.cap{font-size:11px;line-height:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b7280}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(15,23,42,.14);border-radius:999px;padding:4px 12px;font-size:12px;line-height:16px;background:transparent;cursor:pointer}
.chip-on{border-color:rgba(0,117,240,.6);background:rgba(0,117,240,.1);font-weight:500}
.chip b{font-weight:600}
.pill{display:inline-flex;align-items:center;border:1px solid;border-radius:999px;padding:1px 8px;font-size:11px;line-height:16px;font-weight:500;white-space:nowrap}
.p-curso{border-color:rgba(125,211,252,.7);background:rgba(224,242,254,.6);color:#0c4a6e}
.p-cola{border-color:rgba(252,211,77,.7);background:rgba(254,243,199,.6);color:#78350f}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 14px;border:1px solid #e5e7eb;border-radius:8px;background:rgba(255,255,255,.8);font-size:14px;font-weight:500;cursor:pointer}
.btn-sm{min-height:32px;padding:0 12px;font-size:13px}
.btn-pri{border-color:transparent;background:#0075f0;color:#fff}
.btn-pri:disabled{opacity:.5;cursor:not-allowed}
.tabs{display:inline-flex;flex-wrap:wrap;align-items:center;gap:2px;border-radius:8px;background:rgba(15,23,42,.05);padding:4px}
.tab{display:inline-flex;align-items:center;padding:6px 12px;border-radius:6px;font-size:14px;font-weight:500;color:#6b7280;white-space:nowrap}
.tab-on{background:#fff;color:#323a48;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tab-sep{width:1px;height:20px;background:rgba(15,23,42,.14);margin:0 6px}
.spr svg{display:block;width:127px;height:107px;flex:none}

.card-ag{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid rgba(15,23,42,.1);border-radius:16px;padding:6px;background:rgba(255,255,255,.4);text-align:center;width:100%;cursor:pointer;transition:background .3s ease}

.card-on{border-color:rgba(0,117,240,.6);background:rgba(0,117,240,.1);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.item{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;border:1px solid rgba(15,23,42,.1);border-radius:16px;padding:10px 12px;background:rgba(255,255,255,.35);cursor:pointer;transition:background .3s ease}
.item:hover{background:rgba(255,255,255,.65)}
.item-on{border-color:rgba(0,117,240,.6);background:rgba(0,117,240,.07)}
.bub-p{border:1px solid rgba(0,117,240,.4);background:rgba(0,117,240,.1);border-radius:16px;padding:8px 12px}
.bub-a{border:1px solid rgba(15,23,42,.1);background:rgba(255,255,255,.55);border-radius:16px;padding:8px 12px}
