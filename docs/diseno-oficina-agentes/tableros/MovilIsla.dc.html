.mut{color:#6b7280}

.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(15,23,42,.14);border-radius:999px;padding:4px 12px;font-size:12px;line-height:16px;background:transparent;cursor:pointer}

.p-cola{border-color:rgba(252,211,77,.7);background:rgba(254,243,199,.6);color:#78350f}
.p-ok{border-color:rgba(110,231,183,.7);background:rgba(209,250,229,.6);color:#064e3b}
.p-err{border-color:rgba(253,164,175,.7);background:rgba(255,228,230,.6);color:#881337}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 14px;border:1px solid #e5e7eb;border-radius:8px;background:rgba(255,255,255,.8);font-size:14px;font-weight:500;cursor:pointer}
.btn-sm{min-height:32px;padding:0 12px;font-size:13px}

.tabs{display:inline-flex;flex-wrap:wrap;align-items:center;gap:2px;border-radius:8px;background:rgba(15,23,42,.05);padding:4px}
.tab{display:inline-flex;align-items:center;padding:6px 12px;border-radius:6px;font-size:14px;font-weight:500;color:#6b7280;white-space:nowrap}
.tab-on{background:#fff;color:#323a48;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tab-sep{width:1px;height:20px;background:rgba(15,23,42,.14);margin:0 6px}
.spr svg{display:block;width:127px;height:107px;flex:none}
.spr-s svg{width:76px;height:64px}
.card-ag{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid rgba(15,23,42,.1);border-radius:16px;padding:6px;background:rgba(255,255,255,.4);text-align:center;width:100%;cursor:pointer;transition:background .3s ease}
.card-ag:hover{background:rgba(255,255,255,.7)}
.card-on{border-color:rgba(0,117,240,.6);background:rgba(0,117,240,.1);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.item{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;border:1px solid rgba(15,23,42,.1);border-radius:16px;padding:10px 12px;background:rgba(255,255,255,.35);cursor:pointer;transition:background .3s ease}
.item:hover{background:rgba(255,255,255,.65)}
.item-on{border-color:rgba(0,117,240,.6);background:rgba(0,117,240,.07)}
.bub-p{border:1px solid rgba(0,117,240,.4);background:rgba(0,117,240,.1);border-radius:16px;padding:8px 12px}

.scr{overflow-y:auto;scrollbar-width:thin}
@media (prefers-reduced-motion:reduce){.card-ag,.item{transition:none}}

.of-frame-1{opacity:0}
.of-trabajando .of-frame-0{animation:of-a 0.8s steps(1,end) infinite}
.of-trabajando .of-frame-1{animation:of-b 0.8s steps(1,end) infinite}
.of-celebrando .of-frame-0{animation:of-a 1.2s steps(1,end) infinite}
.of-celebrando .of-frame-1{animation:of-b 1.2s steps(1,end) infinite}
.of-sentado .of-frame-1{animation:of-parpadeo 4s steps(1,end) infinite}
.of-sentado .of-frame-0{animation:of-parpadeo-inv 4s steps(1,end) infinite}
.of-atascado .of-emote,.of-con_error .of-emote{animation:of-pulso 2.4s ease-in-out infinite}
.of-descansando .of-emote{animation:of-pulso 3.2s ease-in-out infinite}
@keyframes of-a{0%{opacity:1}50%{opacity:0}}
@keyframes of-b{0%{opacity:0}50%{opacity:1}}
@keyframes of-parpadeo{0%,90%{opacity:0}95%,100%{opacity:1}}
@keyframes of-parpadeo-inv{0%,90%{opacity:1}95%,100%{opacity:0}}
@keyframes of-pulso{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){.of-frame-0,.of-frame-1,.of-emote{animation:none!important}.of-frame-0{opacity:1!important}.of-frame-1{opacity:0!important}}

.isla{position:relative;border-radius:32px;padding:14px 16px 22px;background:linear-gradient(180deg,rgba(255,255,255,.45),var(--tint));border:1px solid rgba(255,255,255,.75);box-shadow:0 18px 40px -22px rgba(107,77,46,.35),inset 0 1px 0 rgba(255,255,255,.8);overflow:hidden}
.suelo{position:absolute;left:3%;right:3%;bottom:-6px;height:62%;border-radius:40px;background:var(--tint2);transform:perspective(600px) rotateX(58deg);transform-origin:50% 100%;box-shadow:0 26px 30px -16px rgba(107,77,46,.35);opacity:.85;pointer-events:none}
.isla-h{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-bottom:6px}
.isla ul{position:relative;list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px}
.ag{display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;padding:4px 4px 6px;border:1px solid transparent;border-radius:18px;background:transparent;cursor:pointer;transition:background .3s ease,transform .3s ease}
.ag:hover{background:rgba(255,255,255,.55);transform:translateY(-2px)}
.ag-on{background:rgba(255,255,255,.75);border-color:rgba(0,117,240,.6);box-shadow:0 6px 18px -8px rgba(0,117,240,.45)}
.act{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:1px 9px;font-size:11px;line-height:16px;font-weight:500;border:1px solid;white-space:nowrap}
.act i{width:7px;height:7px;border-radius:99px;background:currentColor;display:inline-block}
.act-work{border-color:rgba(125,211,252,.8);background:rgba(224,242,254,.8);color:#0c4a6e}
.act-work i{animation:pulso 1.4s ease-in-out infinite}
.act-wait{border-color:rgba(252,211,77,.8);background:rgba(254,243,199,.8);color:#78350f}
.act-err{border-color:rgba(253,164,175,.9);background:rgba(255,228,230,.8);color:#881337}
.act-ok{border-color:rgba(110,231,183,.8);background:rgba(209,250,229,.8);color:#064e3b}
.act-idle{border-color:rgba(15,23,42,.12);background:rgba(255,255,255,.5);color:#4b5563}
@keyframes pulso{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
@media (prefers-reduced-motion:reduce){.act-work i{animation:none}.ag{transition:none}}
.live{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.row{display:flex;align-items:center;gap:12px;border:1px solid rgba(15,23,42,.1);border-radius:16px;background:rgba(255,255,255,.4);padding:10px 14px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:500}
.field input,.field select,.field textarea{border:1px solid #d1d5db;border-radius:8px;background:rgba(255,255,255,.8);padding:8px 12px;font-size:14px;font-weight:400;min-height:36px}
.sw{width:36px;height:20px;border-radius:99px;background:#19a372;position:relative;flex:none}.sw:after{content:'';position:absolute;right:2px;top:2px;width:16px;height:16px;border-radius:99px;background:#fff}
